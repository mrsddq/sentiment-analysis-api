[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "sentiment-analysis-api"
version = "0.1.0"
description = "Explainable, dependency-light sentiment analysis over HTTP"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1"]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "ruff>=0.15,<0.16"]

[project.scripts]
sentiment = "sentiment_api.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sentiment_api"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
